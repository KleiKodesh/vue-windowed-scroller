# Publishes to npm when a GitHub release is published. Needs the NPM_TOKEN secret
# (an npm "Automation" or granular token with publish rights).
name: Publish
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-24.04  # Playwright 1.59 has no browsers for 26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
